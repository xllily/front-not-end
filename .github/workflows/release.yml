name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Verify release candidate
    if: github.repository == 'xllily/front-not-end'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      security-events: read
      id-token: write
      attestations: write
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Check out the tagged repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag and ancestry
        id: release
        shell: bash
        run: |
          release_tag=$GITHUB_REF_NAME

          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be SemVer, for example v1.2.0 or v1.2.0-rc.1; got $release_tag" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "Release tag $release_tag must be an annotated tag." >&2
            exit 1
          fi

          release_commit=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git show-ref --verify --quiet refs/remotes/origin/master; then
            echo "The checkout does not contain origin/master; release ancestry cannot be verified." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/master; then
            echo "Release commit $release_commit is not contained in master." >&2
            exit 1
          fi

          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Require release-commit CI and CodeQL evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: bash .github/scripts/verify-release-checks.sh "$GITHUB_REPOSITORY" "$RELEASE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test release gates
        run: node --test .github/scripts/verify-release-checks.test.mjs

      - name: Pull pinned tracer sandbox image
        run: npm run tracer:pull-image

      - name: Run product harness tests
        run: npm test

      - name: Build and smoke-test the tagged Skill archive
        id: package
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          archive_path=$(bash .github/scripts/package-skill.sh "$GITHUB_REF_NAME" dist "$RELEASE_COMMIT")
          echo "archive=$(basename "$archive_path")" >> "$GITHUB_OUTPUT"

      - name: Attest the verified Skill archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ steps.package.outputs.archive }}
          create-storage-record: false

      - name: Retain the verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Download the verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Create the GitHub Release
        env:
          ARCHIVE: ${{ needs.release-candidate.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.release-candidate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            sha256sum --check "$ARCHIVE.sha256"
            gh attestation verify "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_COMMIT" \
              --deny-self-hosted-runners
          )

          assets=("dist/$ARCHIVE" "dist/$ARCHIVE.sha256")

          if existing_assets=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null); then
            for asset in "${assets[@]}"; do
              if ! grep -Fxq -- "$(basename "$asset")" <<< "$existing_assets"; then
                echo "GitHub Release $RELEASE_TAG exists without $(basename "$asset")." >&2
                echo "Do not mutate a published release; publish a corrective version." >&2
                exit 1
              fi
            done

            echo "GitHub Release $RELEASE_TAG already contains the verified assets."
            exit 0
          fi

          prerelease_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "front-not-end $RELEASE_TAG" \
            "${prerelease_args[@]}" \
            "${assets[@]}"
